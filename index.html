<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title></title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{background:#000;color:#ddd;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:manipulation}
#gate{position:fixed;inset:0;background:#000;z-index:50;touch-action:none;user-select:none;-webkit-user-select:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:#000;z-index:10}
.screen.on{display:flex}
.pad{padding:26px 20px;overflow-y:auto}
h2{font-size:19px;margin-bottom:14px;color:#fff;font-weight:600}
.sub{color:#777;font-size:13px;margin-bottom:18px;line-height:1.55}
input{width:100%;background:#111;border:1px solid #333;color:#eee;border-radius:12px;padding:14px;font-size:16px;margin-bottom:12px;outline:none}
input:focus{border-color:#666}
.btn{width:100%;background:#e8e8e8;color:#000;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700}
.btn:active{background:#aaa}
.dots{display:flex;gap:12px;justify-content:center;margin:6px 0 22px}
.dot{width:13px;height:13px;border-radius:50%;border:2px solid #555}
.dot.f{background:#fff;border-color:#fff}
#msgs{flex:1;overflow-y:auto;padding:16px 14px}
.m{max-width:78%;margin-bottom:10px;padding:9px 13px;border-radius:16px;font-size:15px;line-height:1.45;word-wrap:break-word;white-space:pre-wrap;transition:opacity .6s}
.them{background:#1c1c1e;border-top-left-radius:4px}
.me{background:#14532d;margin-left:auto;border-top-right-radius:4px}
.m.fade{opacity:0}
.sys{text-align:center;color:#555;font-size:12px;margin:8px 0}
.meta{font-size:10px;color:rgba(255,255,255,.4);margin-top:3px}
.pic{max-width:100%;max-height:260px;border-radius:10px;display:block;margin-bottom:4px}
#typing{padding:0 16px 6px;color:#555;font-size:12px;height:18px}
#bar{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #1a1a1a}
#bar input{flex:1;margin:0}
#bar .btn{width:auto;padding:14px 16px;margin:0;font-size:15px}
#picBtn{background:#1c1c1e;color:#fff;border:none;border-radius:12px;padding:0 14px;font-size:18px}
#top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #1a1a1a;touch-action:none;gap:10px}
#top .t{color:#666;font-size:13px}
#lockBtn{background:#1c1c1e;color:#fff;border:none;border-radius:10px;padding:6px 10px;font-size:15px}
#lightbox{position:fixed;inset:0;background:#000;z-index:200;display:none;align-items:center;justify-content:center}
#lightbox img{max-width:100%;max-height:100%}
</style>
</head>
<body>
<div id="gate"></div>

<div class="screen" id="pinScr">
  <div class="pad">
    <h2 id="pinTitle"></h2>
    <div class="dots" id="pinDots"></div>
    <input id="pinIn" type="tel" inputmode="numeric" maxlength="6" placeholder="PIN">
    <div class="sub" id="pinHint"></div>
    <button class="btn" id="pinBtn">OK</button>
  </div>
</div>

<div class="screen" id="setupScr">
  <div class="pad">
    <h2>সেটআপ</h2>
    <div class="sub">দুই ফোনে <b>একই</b> room আর <b>একই</b> secret দিতে হবে — হুবহু এক।</div>
    <input id="roomIn" placeholder="room নাম (যেমন: moon17)">
    <input id="secretIn" placeholder="secret (শুধু তোমরা দুজন জানবে)">
    <input id="nameIn" placeholder="তোমার নাম">
    <button class="btn" id="joinBtn">শুরু করো</button>
    <button id="backBtn" style="display:none;background:none;border:none;color:#666;margin-top:14px;font-size:14px">← ফিরে যাও</button>
  </div>
</div>

<div class="screen" id="chatScr">
  <div id="top">
    <div class="t" id="roomLbl"></div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="t" id="whoLbl"></div>
      <button id="lockBtn">🔒</button>
    </div>
  </div>
  <div id="msgs"></div>
  <div id="typing"></div>
  <div id="bar">
    <button id="picBtn">📷</button>
    <input id="msgIn" placeholder="লিখো…" autocomplete="off">
    <button class="btn" id="sendBtn">➤</button>
  </div>
</div>

<div id="lightbox"><img id="lightboxImg" alt=""></div>
<input type="file" id="fileIn" accept="image/*" style="display:none">

<script src="/socket.io/socket.io.js"></script>
<script>
(function(){
  function save(k,v){try{localStorage.setItem('still_'+k,v)}catch(e){}}
  function load(k){try{return localStorage.getItem('still_'+k)||''}catch(e){return''}}
  function show(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('on')});document.getElementById(id).classList.add('on')}
  function hash(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h+s.charCodeAt(i))|0}return 'h'+h}
  var socket=null,myName='',unlocked=false,tyClear=null,tySent=null;
  var gate=document.getElementById('gate'),msgs=document.getElementById('msgs'),
      msgIn=document.getElementById('msgIn'),typingEl=document.getElementById('typing'),
      roomLbl=document.getElementById('roomLbl'),whoLbl=document.getElementById('whoLbl'),
      chatScr=document.getElementById('chatScr');

  /* ---------- গেট + অটো-লক ---------- */
  var holdT=null,taps=0,tapT=null,px=0,py=0,moved=false;
  function gateOpen(){
    clearTimeout(holdT);holdT=null;gate.style.display='none';
    pinMode=load('pin')?'enter':'create';startPin();
  }
  function lockApp(){
    unlocked=false;hidePic();
    document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('on')});
    msgs.innerHTML='';typingEl.textContent='';
    if(socket)socket.emit('leave');
    gate.style.display='block';
  }
  gate.addEventListener('pointerdown',function(e){px=e.clientX;py=e.clientY;moved=false;holdT=setTimeout(gateOpen,2000)});
  gate.addEventListener('pointermove',function(e){if(Math.abs(e.clientX-px)>18||Math.abs(e.clientY-py)>18){moved=true;clearTimeout(holdT);holdT=null}});
  gate.addEventListener('pointerup',function(){
    if(holdT){clearTimeout(holdT);holdT=null}
    if(moved)return;
    taps++;clearTimeout(tapT);
    if(taps>=3){taps=0;gateOpen();return}
    tapT=setTimeout(function(){taps=0},1600);
  });
  gate.addEventListener('pointercancel',function(){clearTimeout(holdT);holdT=null});
  document.addEventListener('visibilitychange',function(){if(document.hidden)lockApp()});
  window.addEventListener('pagehide',lockApp);
  document.getElementById('lockBtn').addEventListener('click',lockApp);

  /* ---------- PIN ---------- */
  var pinMode='create',pin1='';
  var pinIn=document.getElementById('pinIn'),pinDots=document.getElementById('pinDots'),
      pinTitle=document.getElementById('pinTitle'),pinHint=document.getElementById('pinHint');
  function drawDots(){var n=pinIn.value.length,o='';for(var i=0;i<6;i++)o+='<div class="dot'+(i<n?' f':'')+'"></div>';pinDots.innerHTML=o}
  pinIn.addEventListener('input',drawDots);
  function startPin(){
    show('pinScr');pinIn.value='';drawDots();
    if(pinMode==='create'){pinTitle.textContent='PIN বানাও (৪–৬ সংখ্যা)';pinHint.textContent='এটা এই ফোনের লক।'}
    else if(pinMode==='confirm'){pinTitle.textContent='আবার PIN দাও';pinHint.textContent='নিশ্চিত করতে।'}
    else{pinTitle.textContent='PIN দাও';pinHint.textContent=''}
  }
  function pinDone(){
    var v=pinIn.value.trim();
    if(!/^\d{4,6}$/.test(v)){pinHint.textContent='৪ থেকে ৬ সংখ্যা দাও';return}
    if(pinMode==='create'){pin1=v;pinMode='confirm';startPin()}
    else if(pinMode==='confirm'){
      if(v===pin1){save('pin',hash(v));enterAfter()}
      else{pinMode='create';startPin();pinHint.textContent='মিলেনি — আবার বানাও'}
    }else{
      if(hash(v)===load('pin'))enterAfter();
      else{startPin();pinHint.textContent='ভুল PIN'}
    }
  }
  document.getElementById('pinBtn').addEventListener('click',pinDone);
  pinIn.addEventListener('keydown',function(e){if(e.key==='Enter')pinDone()});

  /* ---------- সেটআপ ---------- */
  var roomIn=document.getElementById('roomIn'),secretIn=document.getElementById('secretIn'),
      nameIn=document.getElementById('nameIn'),backBtn=document.getElementById('backBtn');
  function configured(){return !!(load('room')&&load('secret')&&load('name'))}
  function enterAfter(){configured()?startChat(load('room'),load('secret'),load('name')):startSetup()}
  function startSetup(){
    show('setupScr');
    roomIn.value=load('room');secretIn.value=load('secret');nameIn.value=load('name');
    backBtn.style.display=configured()?'block':'none';
    if(socket)socket.emit('leave');
  }
  backBtn.addEventListener('click',enterAfter);
  function joinRoom(){
    var r=roomIn.value.trim(),s=secretIn.value.trim(),n=nameIn.value.trim();
    if(!r||!s||!n){alert('তিনটা ঘরই পূরণ করো');return}
    save('room',r);save('secret',s);save('name',n);
    startChat(r,s,n);
  }
  document.getElementById('joinBtn').addEventListener('click',joinRoom);

  /* ---------- চ্যাট ---------- */
  function startChat(r,s,n){
    myName=n;roomLbl.textContent='● '+r;whoLbl.textContent=n;
    msgs.innerHTML='';typingEl.textContent='';
    show('chatScr');unlocked=true;
    if(!socket){
      socket=io();
      socket.on('msg',function(d){
        if(!unlocked||!d||!d.id||!chatScr.classList.contains('on'))return;
        addMsg(d);typingEl.textContent='';
        if(d.from!==socket.id){socket.emit('seen',d.id);vanish(d.id)}
      });
      socket.on('seen',function(id){markSeen(id);vanish(id)});
      socket.on('sys',function(t){var div=document.createElement('div');div.className='sys';div.textContent=t;msgs.appendChild(div);scrollDown()});
      socket.on('typing',function(who){if(who!==myName){typingEl.textContent=who+' লিখছে…';clearTimeout(tyClear);tyClear=setTimeout(function(){typingEl.textContent=''},2200)}});
      msgIn.addEventListener('input',function(){if(socket&&!tySent){socket.emit('typing');tySent=true;setTimeout(function(){tySent=false},1500)}});
    }
    socket.emit('join',{room:r,secret:s,name:n});
  }
  function addMsg(d){
    var me=(socket&&d.from===socket.id);
    var div=document.createElement('div');div.className='m '+(me?'me':'them');div.setAttribute('data-id',d.id);
    if(d.img){
      var im=document.createElement('img');im.src=d.img;im.className='pic';im.alt='';
      im.addEventListener('click',function(){showPic(d.img)});
      div.appendChild(im);
    }
    if(d.text){
      if(!me){var b=document.createElement('b');b.textContent=d.name+': ';div.appendChild(b)}
      div.appendChild(document.createTextNode(d.text));
    }
    var meta=document.createElement('div');meta.className='meta';
    var dt=new Date(d.ts||Date.now());
    var hm=dt.getHours()+':'+('0'+dt.getMinutes()).slice(-2);
    meta.innerHTML=hm+(me?' <span class="ticks">✓</span>':'');
    div.appendChild(meta);
    msgs.appendChild(div);scrollDown();
  }
  function markSeen(id){
    var el=msgs.querySelector('[data-id="'+id+'"] .ticks');
    if(el)el.textContent='✓✓';
  }
  function vanish(id){
    setTimeout(function(){
      var el=msgs.querySelector('[data-id="'+id+'"]');
      if(el){el.classList.add('fade');setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},650)}
    },20000);
  }
  function scrollDown(){msgs.scrollTop=msgs.scrollHeight}

  /* ---------- ছবি / GIF ---------- */
  var lb=document.getElementById('lightbox'),lbImg=document.getElementById('lightboxImg');
  function showPic(src){lbImg.src=src;lb.style.display='flex'}
  function hidePic(){lb.style.display='none';lbImg.src=''}
  lb.addEventListener('click',hidePic);
  var fileIn=document.getElementById('fileIn');
  document.getElementById('picBtn').addEventListener('click',function(){fileIn.value='';fileIn.click()});
  fileIn.addEventListener('change',function(){
    var f=fileIn.files&&fileIn.files[0];if(!f||!socket)return;
    if(f.type==='image/gif')readRaw(f);else compress(f);
  });
  function readRaw(f){
    var r=new FileReader();
    r.onload=function(){
      if(r.result.length>4500000){alert('GIF টা অনেক বড় — ৪MB এর ছোটটা দাও');return}
      socket.emit('msg',{text:'',img:r.result});
    };
    r.readAsDataURL(f);
  }
  function compress(f){
    var url=URL.createObjectURL(f),im=new Image();
    im.onload=function(){
      var max=1200,w=im.width,h=im.height;
      if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}
      var c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(im,0,0,w,h);
      URL.revokeObjectURL(url);
      socket.emit('msg',{text:'',img:c.toDataURL('image/jpeg',0.75)});
    };
    im.onerror=function(){URL.revokeObjectURL(url)};
    im.src=url;
  }

  /* ---------- পাঠানো ---------- */
  function send(){var t=msgIn.value.trim();if(!t||!socket)return;socket.emit('msg',{text:t});msgIn.value=''}
  document.getElementById('sendBtn').addEventListener('click',send);
  msgIn.addEventListener('keydown',function(e){if(e.key==='Enter')send()});

  /* চ্যাটের উপরের বারে ২ সেকেন্ড চেপে ধরলে setup খোলে (room বদলাতে) */
  var topBar=document.getElementById('top'),topT=null;
  topBar.addEventListener('pointerdown',function(e){if(e.target.id==='lockBtn')return;topT=setTimeout(startSetup,2000)});
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){topBar.addEventListener(ev,function(){clearTimeout(topT)})});
})();
</script>
</body>
</html>
